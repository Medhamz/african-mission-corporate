<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle}">Administration - Newsletter</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        body { background: var(--bg-primary); padding-top: 20px; font-family: 'Inter', sans-serif; }
        .admin-wrapper { max-width: 1200px; margin: 0 auto; padding: 20px; }
        .admin-header { display: flex; justify-content: space-between; align-items: center; padding: 20px 0; border-bottom: 1px solid var(--border-light); margin-bottom: 30px; }
        .admin-header h1 { color: var(--text-primary); font-weight: 700; font-size: 1.5rem; margin: 0; }
        .btn-back { color: var(--text-secondary); text-decoration: none; transition: all 0.3s ease; }
        .btn-back:hover { color: var(--primary-blue); }
        .table { color: var(--text-secondary); }
        .table th { color: var(--text-primary); border-color: var(--border-light); }
        .table td { border-color: var(--border-light); vertical-align: middle; }
        .stat-card { background: var(--bg-card); border: 1px solid var(--border-light); border-radius: var(--radius-md); padding: 24px; text-align: center; }
        .stat-card .stat-number { font-size: 2.2rem; font-weight: 700; color: var(--text-primary); }
        .stat-card .stat-label { color: var(--text-secondary); font-size: 0.9rem; }
    </style>
</head>
<body>

<div class="admin-wrapper">
    <header class="admin-header">
        <div style="display: flex; align-items: center; gap: 16px;">
            <a href="/admin/dashboard" class="btn-back"><i class="fas fa-arrow-left"></i></a>
            <h1><i class="fas fa-envelope" style="color: var(--primary-blue);"></i> Newsletter</h1>
        </div>
        <div>
            <a href="/admin/export/subscribers" class="btn btn-outline-primary btn-sm">
                <i class="fas fa-file-export me-1"></i> Exporter en CSV
            </a>
        </div>
    </header>

    <!-- Message Flash / Toast -->
    <div th:if="${toastMessage}" class="alert alert-dismissible fade show"
         th:classappend="${toastType == 'success' ? 'alert-success' : 'alert-danger'}" role="alert">
        <span th:text="${toastMessage}">Opération réussie</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <div class="row g-4 mb-4">
        <div class="col-md-6">
            <div class="stat-card">
                <div class="stat-number" th:text="${subscribers.size()}">0</div>
                <div class="stat-label">Total Abonnés Enregistrés</div>
            </div>
        </div>
        <div class="col-md-6">
            <div class="stat-card">
                <div class="stat-number" th:text="${#lists.size(subscribers.?[isActive == true])}">0</div>
                <div class="stat-label">Abonnés Actifs</div>
            </div>
        </div>
    </div>

    <div class="table-responsive">
        <table class="table align-middle">
            <thead>
            <tr>
                <th>#</th>
                <th>Email</th>
                <th>Date d'inscription</th>
                <th>Statut</th>
                <th class="text-end">Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="sub : ${subscribers}">
                <td th:text="${sub.id}">1</td>
                <td th:text="${sub.email}" style="color: var(--primary-blue); font-weight: 500;">email@example.com</td>
                <td th:text="${sub.subscribedAt != null ? #temporals.format(sub.subscribedAt, 'dd/MM/yyyy HH:mm') : 'N/A'}">01/01/2026 12:00</td>
                <td>
                    <span th:if="${sub.isActive}" class="badge bg-success">Actif</span>
                    <span th:unless="${sub.isActive}" class="badge bg-secondary">Inactif / Désabonné</span>
                </td>
                <td class="text-end">
                    <!-- Basculer le statut (Désactiver / Réactiver) -->
                    <form th:action="@{/admin/newsletter/toggle/{id}(id=${sub.id})}" method="post" style="display:inline;">
                        <button type="submit"
                                th:class="${sub.isActive ? 'btn btn-sm btn-outline-warning' : 'btn btn-sm btn-outline-success'}"
                                th:title="${sub.isActive ? 'Désactiver' : 'Activer'}"
                                th:onclick="return confirm([[${sub.isActive ? 'Désactiver cet abonné ?' : 'Réactiver cet abonné ?'}]]);">
                            <i th:class="${sub.isActive ? 'fas fa-user-slash' : 'fas fa-user-check'}"></i>
                        </button>
                    </form>

                    <!-- Éditer l'abonné (Modal Bootstrap) -->
                    <button type="button" class="btn btn-sm btn-outline-primary" data-bs-toggle="modal" th:data-bs-target="'#editModal-' + ${sub.id}" title="Modifier">
                        <i class="fas fa-edit"></i>
                    </button>

                    <!-- Supprimer définitivement -->
                    <form th:action="@{/admin/newsletter/delete/{id}(id=${sub.id})}" method="post" style="display:inline;">
                        <button type="submit" class="btn btn-sm btn-outline-danger" title="Supprimer définitivement" onclick="return confirm('Supprimer définitivement cet abonné de la base de données ?');">
                            <i class="fas fa-trash"></i>
                        </button>
                    </form>

                    <!-- Modal d'édition pour chaque ligne -->
                    <div class="modal fade text-start" th:id="'editModal-' + ${sub.id}" tabindex="-1" aria-hidden="true">
                        <div class="modal-dialog">
                            <div class="modal-content">
                                <form th:action="@{/admin/newsletter/update/{id}(id=${sub.id})}" method="post">
                                    <div class="modal-header">
                                        <h5 class="modal-title">Modifier l'abonné</h5>
                                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fermer"></button>
                                    </div>
                                    <div class="modal-body">
                                        <div class="mb-3">
                                            <label class="form-label">Adresse Email</label>
                                            <input type="email" name="email" class="form-control" th:value="${sub.email}" required>
                                        </div>
                                        <div class="form-check form-switch">
                                            <input class="form-check-input" type="checkbox" name="isActive" value="true" th:checked="${sub.isActive}" th:id="'isActiveSwitch-' + ${sub.id}">
                                            <label class="form-check-label" th:for="'isActiveSwitch-' + ${sub.id}">Compte Actif</label>
                                        </div>
                                    </div>
                                    <div class="modal-footer">
                                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Annuler</button>
                                        <button type="submit" class="btn btn-primary">Enregistrer</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>
                </td>
            </tr>
            <tr th:if="${subscribers.isEmpty()}">
                <td colspan="5" class="text-center text-muted" style="padding: 40px;">
                    <i class="fas fa-inbox" style="font-size: 2rem; opacity: 0.3;"></i>
                    <p class="mt-2">Aucun abonné pour le moment</p>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Connexion</title>

    <!-- Bootstrap 5.3 & Icons & Fonts -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">

    <style>
        body {
            background-color: var(--bg-primary, #0b1120);
            color: var(--text-primary, #f1f5f9);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            overflow: hidden;
            position: relative;
        }

        /* Canvas Particules */
        #particles-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        /* Container 3D */
        .login-wrapper {
            perspective: 1000px;
            z-index: 2;
            width: 100%;
            max-width: 440px;
            padding: 20px;
        }

        /* Carte Login Premium 3D */
        .login-card-3d {
            background: rgba(15, 23, 42, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5),
                        0 0 40px rgba(59, 130, 246, 0.15);
            transform-style: preserve-3d;
            transition: transform 0.2s ease, box-shadow 0.3s ease;
            position: relative;
        }

        .login-card-3d:hover {
            box-shadow: 0 30px 60px -12px rgba(0, 0, 0, 0.6),
                        0 0 50px rgba(139, 92, 246, 0.25);
        }

        .login-card-3d * {
            transform: translateZ(20px);
        }

        .cyber-logo {
            font-size: 3rem;
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 16px;
            filter: drop-shadow(0 0 15px rgba(59, 130, 246, 0.4));
        }

        .login-card-3d h2 {
            color: var(--text-primary, #f1f5f9);
            font-weight: 800;
            letter-spacing: -0.5px;
            margin-bottom: 6px;
        }

        .login-card-3d p {
            color: var(--text-secondary, #94a3b8);
            font-size: 0.9rem;
            margin-bottom: 28px;
        }

        .input-glass-group {
            position: relative;
            margin-bottom: 20px;
        }

        .input-glass-group i {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%) translateZ(20px);
            color: var(--text-muted, #64748b);
            transition: color 0.3s ease;
        }

        .input-glass {
            background: rgba(255, 255, 255, 0.03) !important;
            border: 1px solid rgba(255, 255, 255, 0.08) !important;
            color: #fff !important;
            padding: 12px 16px 12px 46px !important;
            border-radius: 12px !important;
            font-size: 0.95rem;
            transition: all 0.3s ease !important;
        }

        .input-glass:focus {
            background: rgba(255, 255, 255, 0.06) !important;
            border-color: #3b82f6 !important;
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.25) !important;
            outline: none;
        }

        .input-glass-group:focus-within i {
            color: #3b82f6;
        }

        .btn-gradient-3d {
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            border: none;
            color: #fff;
            padding: 12px;
            font-weight: 600;
            border-radius: 12px;
            width: 100%;
            transition: all 0.3s ease;
            box-shadow: 0 8px 25px rgba(59, 130, 246, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-gradient-3d:hover {
            transform: translateZ(30px) scale(1.02);
            box-shadow: 0 12px 35px rgba(139, 92, 246, 0.4);
            color: #fff;
        }

        .alert-danger-glass {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.25);
            color: #f87171;
            border-radius: 12px;
            padding: 10px 16px;
            font-size: 0.88rem;
            margin-bottom: 20px;
            backdrop-filter: blur(4px);
        }
    </style>

    <!-- Favicon (icône de l'onglet du navigateur) -->
    <link rel="icon" href="/images/image.jpg" type="image/jpeg">

    <!-- Image de prévisualisation (partage de liens, WhatsApp, Facebook) -->
    <meta property="og:image" content="/images/image.jpg">
    <meta name="twitter:image" content="/images/image.jpg">
</head>
<body>

<!-- Canvas pour les particules lumineuses -->
<canvas id="particles-canvas"></canvas>

<div class="login-wrapper">
    <div class="login-card-3d" id="tiltCard">
        <div class="text-center">
            <i class="fas fa-shield-alt cyber-logo"></i>
            <h2>Administration</h2>
            <p>Connectez-vous pour accéder au back-office</p>
        </div>

        <div th:if="${param.error}" class="alert-danger-glass text-center">
            <i class="fas fa-exclamation-circle me-1"></i> Identifiants incorrects
        </div>

        <form method="post" action="/admin/login">
            <div class="input-glass-group">
                <i class="fas fa-user"></i>
                <input type="text" name="username" class="form-control input-glass" placeholder="Nom d'utilisateur" required autocomplete="off">
            </div>
            <div class="input-glass-group">
                <i class="fas fa-lock"></i>
                <input type="password" name="password" class="form-control input-glass" placeholder="Mot de passe" required>
            </div>
            <button type="submit" class="btn btn-gradient-3d mt-2">
                Se connecter <i class="fas fa-arrow-right"></i>
            </button>
        </form>

        <div class="text-center mt-4" style="color: var(--text-muted, #64748b); font-size: 0.8rem;">
            <span>African Mission Corporate &copy; 2026</span>
        </div>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/vanilla-tilt/1.8.1/vanilla-tilt.min.js"></script>
<script>
    // Effet Tilt 3D
    VanillaTilt.init(document.querySelector("#tiltCard"), {
        max: 12,
        speed: 400,
        glare: true,
        "max-glare": 0.2
    });

    // Particules lumineuses
    const canvas = document.getElementById('particles-canvas');
    const ctx = canvas.getContext('2d');
    let particles = [];

    function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    class Particle {
        constructor() {
            this.reset();
        }
        reset() {
            this.x = Math.random() * canvas.width;
            this.y = Math.random() * canvas.height;
            this.size = Math.random() * 2.5 + 0.5;
            this.speedX = (Math.random() - 0.5) * 0.4;
            this.speedY = (Math.random() - 0.5) * 0.4;
            this.opacity = Math.random() * 0.6 + 0.2;
            this.color = Math.random() > 0.5 ? '#3b82f6' : '#8b5cf6';
        }
        update() {
            this.x += this.speedX;
            this.y += this.speedY;
            if (this.x < 0 || this.x > canvas.width || this.y < 0 || this.y > canvas.height) {
                this.reset();
            }
        }
        draw() {
            ctx.save();
            ctx.globalAlpha = this.opacity;
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctx.fillStyle = this.color;
            ctx.shadowBlur = 10;
            ctx.shadowColor = this.color;
            ctx.fill();
            ctx.restore();
        }
    }

    for (let i = 0; i < 60; i++) {
        particles.push(new Particle());
    }

    function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        particles.forEach(p => {
            p.update();
            p.draw();
        });
        requestAnimationFrame(animate);
    }
    animate();
</script>
</body>
</html>

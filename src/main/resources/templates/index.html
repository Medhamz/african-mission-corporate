<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle}">African Mission Corporate</title>

    <!-- PWA, Bootstrap, FontAwesome, AOS, CSS ... -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#0a0a1a">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/market-data.css}">
    <link rel="stylesheet" th:href="@{/css/timeline.css}">
    <link rel="stylesheet" th:href="@{/css/project-timeline.css}">

    <!-- Three.js et Model-Viewer -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
</head>
<body>

<!-- Scroll Progress -->
<div id="scrollProgress" style="position: fixed; top: 0; left: 0; width: 0%; height: 3px; background: var(--gradient-main); z-index: 9999; transition: width 0.1s ease; box-shadow: 0 0 20px rgba(59, 130, 246, 0.3);"></div>

<!-- Toast Container -->
<div id="toastContainer" style="position: fixed; bottom: 30px; right: 30px; z-index: 9999; display: flex; flex-direction: column; gap: 10px; max-width: 400px;"></div>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark fixed-top premium-navbar" id="mainNav">
    <div class="container">
        <a class="logo-premium" href="/">
            <span class="logo-premium-icon"><i class="fas fa-globe-africa"></i></span>
            <div>
                <span class="logo-premium-text">African Mission <span class="highlight">Corporate</span></span>
            </div>
        </a>

        <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto menu-premium">
                <li class="nav-item"><a class="nav-link active" href="/"><i class="fas fa-home nav-icon"></i>Accueil</a></li>
                <li class="nav-item"><a class="nav-link" href="/about"><i class="fas fa-info-circle nav-icon"></i>À propos</a></li>
                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle" href="#" id="servicesDropdown" role="button" data-bs-toggle="dropdown">
                        <i class="fas fa-cogs nav-icon"></i>Services
                    </a>
                    <ul class="dropdown-menu dropdown-premium">
                        <li><a class="dropdown-item" href="/services"><i class="fas fa-briefcase"></i>Nos services <span class="item-shortcut">↗</span></a></li>
                        <li><a class="dropdown-item" href="/activities"><i class="fas fa-tasks"></i>Activités</a></li>
                        <li><a class="dropdown-item" href="/projects"><i class="fas fa-rocket"></i>Projets</a></li>
                        <li><hr class="dropdown-divider"></li>
                        <li><a class="dropdown-item" href="/faq"><i class="fas fa-question-circle"></i>FAQ</a></li>
                    </ul>
                </li>
                <li class="nav-item"><a class="nav-link" href="/team"><i class="fas fa-users nav-icon"></i>Équipe</a></li>
                <li class="nav-item"><a class="nav-link" href="/careers"><i class="fas fa-briefcase nav-icon"></i>Carrières</a></li>
                <li class="nav-item"><a class="nav-link" href="/blog"><i class="fas fa-newspaper nav-icon"></i>Blog</a></li>
                <li class="nav-item"><a class="nav-link" href="/diagnostiqueur"><i class="fas fa-stethoscope nav-icon"></i>Diagnostiqueur</a></li>
                <li class="nav-item"><a class="nav-link" href="/monde"><i class="fas fa-globe-africa nav-icon"></i>Carte du Monde</a></li>
                <li class="nav-item"><a class="nav-link" href="/eco"><i class="fas fa-leaf nav-icon"></i>Éco-responsabilité</a></li>
                <li class="nav-item"><a class="nav-link" href="/kiosk"><i class="fas fa-desktop nav-icon"></i>Mode Kiosque</a></li>
                <li class="nav-item"><a class="nav-link" href="/contact"><i class="fas fa-envelope nav-icon"></i>Contact</a></li>
            </ul>

            <div class="d-flex align-items-center gap-3">
                <!-- BARRE DE RECHERCHE DESKTOP -->
                <div class="search-premium" style="display: flex; align-items: center; background: rgba(255,255,255,0.03); border: 1px solid var(--border-light); border-radius: var(--radius-full); padding: 3px; transition: all 0.3s ease; min-width: 180px;">
                    <input type="text" id="searchInputDesktop" placeholder="Rechercher..." style="background: transparent; border: none; color: var(--text-primary); padding: 6px 16px; font-size: 0.85rem; width: 100%; outline: none;">
                    <button class="search-btn" onclick="performSearch()" style="background: var(--gradient-main); border: none; color: #fff; border-radius: var(--radius-full); padding: 6px 18px; font-size: 0.8rem; cursor: pointer; transition: all 0.3s ease; display: flex; align-items: center; gap: 6px;">
                        <i class="fas fa-search"></i>
                    </button>
                </div>
                <a href="/contact" class="cta-premium"><i class="fas fa-paper-plane"></i> Devis</a>
                <button onclick="toggleTheme()" style="background: transparent; border: 1px solid var(--border-light); color: var(--text-secondary); padding: 8px 14px; border-radius: 50px; cursor: pointer; transition: all 0.3s ease;">
                    <i class="fas fa-moon" id="themeIcon"></i>
                </button>
            </div>
        </div>
    </div>
</nav>

<!-- MOBILE SEARCH -->
<div class="mobile-search-premium" id="mobileSearch" style="position: fixed; top: 76px; left: 0; width: 100%; padding: 12px 16px; background: var(--bg-primary); border-bottom: 1px solid var(--border-light); z-index: 999; transform: translateY(-100%); transition: transform 0.3s ease, background 0.3s ease;">
    <div style="display: flex; gap: 8px;">
        <input type="text" id="searchInputMobile" placeholder="Rechercher..." style="flex: 1; background: var(--bg-secondary); border: 1px solid var(--border-light); border-radius: var(--radius-full); padding: 10px 16px; color: var(--text-primary); font-size: 0.9rem; outline: none;">
        <button onclick="performSearch()" style="background: var(--gradient-main); border: none; border-radius: var(--radius-full); padding: 10px 24px; color: #fff; font-weight: 600; transition: all 0.3s ease;">
            <i class="fas fa-search"></i>
        </button>
    </div>
</div>

<!-- Contenu de la page (identique) -->
<!-- ... (tout le contenu de l'index reste inchangé) ... -->

<!-- FOOTER (inchangé) -->
<footer class="footer-premium">
    <!-- ... -->
</footer>

<!-- Scripts -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
<!-- ... autres scripts ... -->

<script>
    // ============================================
    // FONCTION DE RECHERCHE UNIFIÉE
    // ============================================
    function performSearch() {
        // Récupérer la valeur depuis l'input desktop ou mobile
        const desktopInput = document.getElementById('searchInputDesktop');
        const mobileInput = document.getElementById('searchInputMobile');
        let query = '';
        if (desktopInput && desktopInput.value.trim() !== '') {
            query = desktopInput.value.trim().toLowerCase();
        } else if (mobileInput && mobileInput.value.trim() !== '') {
            query = mobileInput.value.trim().toLowerCase();
        } else {
            // Si les deux sont vides, on réinitialise l'affichage
            resetSearch();
            return;
        }

        // Si la requête est vide, on réinitialise
        if (query === '') {
            resetSearch();
            return;
        }

        // Cibler les éléments recherchables sur la page
        const searchableItems = document.querySelectorAll(
            '.card-premium, .partner-premium, .project-item, .blog-item, .faq-item, .team-member, .service-item'
        );
        // Ajouter également les sections de texte importantes
        const textElements = document.querySelectorAll(
            '.hero-title, .hero-subtitle, .section-title, .section-tag, .page-header h1, .page-header p'
        );

        let found = false;

        // Parcourir les éléments de carte
        searchableItems.forEach(item => {
            const text = item.textContent.toLowerCase();
            if (text.includes(query)) {
                item.style.display = ''; // réafficher
                found = true;
            } else {
                item.style.display = 'none';
            }
        });

        // Pour les éléments de texte (non masquables), on les surligne ou on scroll vers eux
        textElements.forEach(el => {
            const text = el.textContent.toLowerCase();
            if (text.includes(query)) {
                el.style.backgroundColor = 'rgba(59, 130, 246, 0.1)';
                el.style.transition = 'background 0.3s';
                // scroll vers le premier élément trouvé
                if (!found) {
                    el.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    found = true;
                }
            } else {
                el.style.backgroundColor = 'transparent';
            }
        });

        // Si aucun résultat, afficher un toast
        if (!found) {
            showToast('Aucun résultat trouvé pour "' + query + '"', 'error');
        } else {
            showToast('Résultats trouvés pour "' + query + '"', 'success');
        }
    }

    function resetSearch() {
        // Réafficher tous les éléments masqués
        document.querySelectorAll('.card-premium, .partner-premium, .project-item, .blog-item, .faq-item, .team-member, .service-item')
            .forEach(item => item.style.display = '');
        // Effacer les surlignages
        document.querySelectorAll('.hero-title, .hero-subtitle, .section-title, .section-tag, .page-header h1, .page-header p')
            .forEach(el => el.style.backgroundColor = 'transparent');
        // Vider les champs de recherche
        const desktopInput = document.getElementById('searchInputDesktop');
        const mobileInput = document.getElementById('searchInputMobile');
        if (desktopInput) desktopInput.value = '';
        if (mobileInput) mobileInput.value = '';
    }

    // Permettre la recherche avec la touche Entrée
    document.addEventListener('DOMContentLoaded', function() {
        const desktopInput = document.getElementById('searchInputDesktop');
        const mobileInput = document.getElementById('searchInputMobile');
        if (desktopInput) {
            desktopInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') performSearch();
            });
        }
        if (mobileInput) {
            mobileInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') performSearch();
            });
        }
    });

    // ============================================
    // AOS, NAVBAR SCROLL, THEME TOGGLE, etc.
    // ============================================
    AOS.init({ duration: 800, once: true, offset: 80, easing: 'ease-out-cubic' });

    const navbar = document.getElementById('mainNav');
    const mobileSearch = document.getElementById('mobileSearch');

    window.addEventListener('scroll', function() {
        if (window.scrollY > 50) navbar.classList.add('scrolled');
        else navbar.classList.remove('scrolled');
        if (mobileSearch) {
            if (window.scrollY > 150) mobileSearch.classList.remove('visible');
            else mobileSearch.classList.add('visible');
        }
    });
    if (mobileSearch) mobileSearch.classList.add('visible');

    // Scroll Progress
    window.addEventListener('scroll', function() {
        const scrollTop = window.scrollY;
        const docHeight = document.documentElement.scrollHeight - window.innerHeight;
        const scrollPercent = (scrollTop / docHeight) * 100;
        document.getElementById('scrollProgress').style.width = scrollPercent + '%';
    });

    function toggleTheme() {
        const body = document.body;
        const icon = document.getElementById('themeIcon');
        const isDark = body.getAttribute('data-theme') !== 'light';
        if (isDark) {
            body.setAttribute('data-theme', 'light');
            icon.className = 'fas fa-sun';
            localStorage.setItem('theme', 'light');
        } else {
            body.removeAttribute('data-theme');
            icon.className = 'fas fa-moon';
            localStorage.setItem('theme', 'dark');
        }
    }

    document.addEventListener('DOMContentLoaded', function() {
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme === 'light') {
            document.body.setAttribute('data-theme', 'light');
            document.getElementById('themeIcon').className = 'fas fa-sun';
        }
    });

    // Toast function
    function showToast(message, type = 'success') {
        const container = document.getElementById('toastContainer');
        const toast = document.createElement('div');
        const bgColor = type === 'success' ? '#1e293b' : '#ef4444';
        const icon = type === 'success' ? 'fa-check-circle' : 'fa-exclamation-circle';
        toast.style.cssText = `
            background: ${bgColor};
            color: #fff;
            padding: 16px 24px;
            border-radius: 12px;
            border-left: 4px solid ${type === 'success' ? '#3b82f6' : '#ef4444'};
            box-shadow: 0 8px 40px rgba(0,0,0,0.2);
            animation: slideIn 0.3s ease;
            font-family: 'Inter', sans-serif;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 12px;
        `;
        toast.innerHTML = `<i class="fas ${icon}" style="font-size: 1.2rem;"></i><span>${message}</span>`;
        container.appendChild(toast);
        setTimeout(() => {
            toast.style.opacity = '0';
            toast.style.transform = 'translateX(100px)';
            toast.style.transition = 'all 0.3s ease';
            setTimeout(() => toast.remove(), 300);
        }, 4000);
    }

    const style = document.createElement('style');
    style.textContent = `
        @keyframes slideIn {
            from { opacity: 0; transform: translateX(50px); }
            to { opacity: 1; transform: translateX(0); }
        }
    `;
    document.head.appendChild(style);
</script>

</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<div th:fragment="footer" class="admin-footer">
    <style>
        .admin-footer {
            margin-top: 50px;
            padding: 20px 24px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            background: rgba(15, 23, 42, 0.4);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            text-align: center;
            font-size: 0.8rem;
            color: var(--text-muted, #64748b);
            border-radius: 16px 16px 0 0;
        }

        .admin-footer a {
            color: #3b82f6;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.2s ease, text-shadow 0.2s ease;
        }

        .admin-footer a:hover {
            color: #8b5cf6;
            text-shadow: 0 0 10px rgba(139, 92, 246, 0.4);
        }

        .admin-footer .footer-dot {
            display: inline-block;
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            margin: 0 12px;
            vertical-align: middle;
        }

        .admin-footer .badge-version {
            background: rgba(59, 130, 246, 0.1);
            color: #3b82f6;
            border: 1px solid rgba(59, 130, 246, 0.25);
            padding: 2px 8px;
            border-radius: 50px;
            font-size: 0.7rem;
            font-weight: 700;
        }

        @media (max-width: 576px) {
            .admin-footer {
                font-size: 0.72rem;
                padding: 14px 16px;
            }
        }
    </style>

    <div>
        &copy; 2026 <a href="/" target="_blank">African Mission Corporate</a>
        <span class="footer-dot"></span>
        <span class="badge-version">v2.0 Premium</span>
        <span class="footer-dot"></span>
        <span th:text="${#dates.format(#dates.createNow(), 'dd/MM/yyyy HH:mm')}"></span>
    </div>
</div>
</html>

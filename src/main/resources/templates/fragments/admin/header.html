<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title} + ' - Administration'">Administration</title>

    <!-- Fonts & Icons & Frameworks -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">

    <style>
        :root {
            --bg-primary: #0b1120;
            --bg-card: rgba(15, 23, 42, 0.65);
            --border-light: rgba(255, 255, 255, 0.08);
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --gradient-main: linear-gradient(135deg, #3b82f6, #8b5cf6);
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            margin: 0;
            overflow-x: hidden;
        }

        .wrapper {
            display: flex;
            min-height: 100vh;
        }

        .main-content {
            flex: 1;
            padding: 24px 32px 80px;
            margin-left: 260px;
            transition: margin-left 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            z-index: 1;
        }

        @media (max-width: 768px) {
            .main-content {
                margin-left: 0;
                padding: 16px 16px 60px;
            }
        }
    </style>
</head>

<div th:fragment="header(pageTitle, subtitle)" class="admin-header">
    <style>
        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0 24px 0;
            border-bottom: 1px solid var(--border-light, rgba(255,255,255,0.08));
            margin-bottom: 32px;
            flex-wrap: wrap;
            gap: 16px;
        }

        .admin-header-title {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .admin-header-icon {
            width: 44px;
            height: 44px;
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 1.2rem;
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.3);
        }

        .admin-header h1 {
            color: var(--text-primary, #f1f5f9);
            font-weight: 800;
            font-size: 1.5rem;
            letter-spacing: -0.5px;
            margin: 0;
        }

        .admin-header .subtitle {
            color: var(--text-muted, #64748b);
            font-size: 0.88rem;
            margin-top: 2px;
            font-weight: 500;
        }
    </style>

    <div class="admin-header-title">
        <div class="admin-header-icon">
            <i class="fas fa-shield-alt"></i>
        </div>
        <div>
            <h1 th:text="${pageTitle}">Administration</h1>
            <div th:if="${subtitle}" class="subtitle" th:text="${subtitle}"></div>
        </div>
    </div>
</div>
</html>

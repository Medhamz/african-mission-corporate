<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title} + ' - Administration'">Administration</title>

    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: #0b1120;
            color: #f1f5f9;
            min-height: 100vh;
        }
        .wrapper {
            display: flex;
            min-height: 100vh;
        }
        .main-content {
            flex: 1;
            padding: 20px 24px 80px;
            margin-left: 260px; /* largeur de la sidebar */
            transition: margin-left 0.3s ease;
        }
        @media (max-width: 768px) {
            .main-content {
                margin-left: 0;
                padding: 16px;
            }
        }
    </style>
</head>

<div th:fragment="header(pageTitle, subtitle)" class="admin-header" style="display:flex; justify-content:space-between; align-items:center; padding:20px 0; border-bottom:1px solid rgba(255,255,255,0.04); margin-bottom:30px; flex-wrap:wrap; gap:16px;">
    <h1 style="color: var(--text-primary); font-weight: 700; font-size: 1.5rem;">
        <i class="fas fa-shield-alt" style="color: var(--primary-blue); margin-right:10px;"></i>
        <span th:text="${pageTitle}">Administration</span>
    </h1>
    <div th:if="${subtitle}" style="color: var(--text-muted); font-size: 0.9rem;" th:text="${subtitle}"></div>
</div>

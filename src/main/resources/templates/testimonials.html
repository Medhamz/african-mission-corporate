<!-- SECTION TÉMOIGNAGES (DYNAMIQUE) -->
<section class="py-5" style="background: var(--bg-primary);">
    <div class="container">
        <!-- Message de succès / alerte -->
        <div th:if="${successMessage}" class="alert alert-success text-center mb-4" role="alert" style="border-radius: 12px; background: rgba(34,197,94,0.1); border: 1px solid rgba(34,197,94,0.3); color: #22c55e;">
            <i class="fas fa-check-circle me-2"></i><span th:text="${successMessage}"></span>
        </div>

        <div class="row g-4">
            <!-- Liste des témoignages approuvés -->
            <div class="col-md-4 testimonial-item" th:each="t : ${testimonials}" th:if="${t.isApproved}" data-aos="flip-up">
                <div class="card-premium text-center" style="padding: 32px; height: 100%;">
                    <div style="font-size: 3rem; color: var(--primary-blue); opacity: 0.15; margin-bottom: 8px;">
                        <i class="fas fa-quote-right"></i>
                    </div>
                    <!-- Stars -->
                    <div class="mb-2" style="color: #f59e0b;">
                        <span th:each="i : ${#numbers.sequence(1, t.rating)}">★</span>
                    </div>
                    <p style="color: var(--text-secondary); font-style: italic; font-size: 0.95rem; line-height: 1.7;" th:text="'&quot;' + ${t.content} + '&quot;'">
                        "Contenu..."
                    </p>
                    <div style="margin-top: auto; padding-top: 16px;">
                        <div style="width: 50px; height: 50px; border-radius: 50%; background: var(--bg-secondary); margin: 0 auto; display: flex; align-items: center; justify-content: center;">
                            <i class="fas fa-user" style="color: var(--primary-blue);"></i>
                        </div>
                        <h6 style="color: var(--text-primary); margin-top: 8px; font-weight: 600;" th:text="${t.clientName}">Nom Client</h6>
                        <p style="color: var(--text-muted); font-size: 0.8rem;" th:text="${t.company != null && !t.company.isEmpty() ? t.company : 'Client'}">Entreprise</p>
                    </div>
                </div>
            </div>

            <!-- Message si aucun témoignage -->
            <div class="col-12 text-center text-muted py-4" th:if="${testimonials == null || testimonials.isEmpty()}">
                <p>Aucun témoignage pour le moment. Soyez le premier à donner votre avis !</p>
            </div>
        </div>

        <!-- FORMULAIRE POUR SOUMETTRE UN TÉMOIGNAGE -->
        <div class="row justify-content-center mt-5" data-aos="fade-up">
            <div class="col-lg-8">
                <div class="card-premium" style="padding: 32px;">
                    <div class="text-center mb-4">
                        <h3 class="fw-bold" style="color: var(--text-primary);">Laissez votre témoignage</h3>
                        <p style="color: var(--text-secondary); font-size: 0.9rem;">Votre avis sera publié après validation par notre équipe.</p>
                    </div>
                    <form method="post" th:action="@{/testimonials/submit}">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label" style="color: var(--text-secondary); font-size: 0.85rem;">Nom complet *</label>
                                <input type="text" name="clientName" class="form-control" placeholder="Ex: Moussa Diarra" required style="background: var(--bg-secondary); border: 1px solid var(--border-light); color: var(--text-primary); border-radius: 8px; padding: 10px;">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label" style="color: var(--text-secondary); font-size: 0.85rem;">Entreprise / Poste</label>
                                <input type="text" name="company" class="form-control" placeholder="Ex: CEO, Tech Solutions" style="background: var(--bg-secondary); border: 1px solid var(--border-light); color: var(--text-primary); border-radius: 8px; padding: 10px;">
                            </div>
                            <div class="col-md-12">
                                <label class="form-label" style="color: var(--text-secondary); font-size: 0.85rem;">Note *</label>
                                <select name="rating" class="form-select" style="background: var(--bg-secondary); border: 1px solid var(--border-light); color: var(--text-primary); border-radius: 8px; padding: 10px;">
                                    <option value="5" selected>★★★★★ (5/5)</option>
                                    <option value="4">★★★★☆ (4/5)</option>
                                    <option value="3">★★★☆☆ (3/5)</option>
                                    <option value="2">★★☆☆☆ (2/5)</option>
                                    <option value="1">★☆☆☆☆ (1/5)</option>
                                </select>
                            </div>
                            <div class="col-md-12">
                                <label class="form-label" style="color: var(--text-secondary); font-size: 0.85rem;">Votre témoignage *</label>
                                <textarea name="content" rows="4" class="form-control" placeholder="Partagez votre expérience avec nous..." required style="background: var(--bg-secondary); border: 1px solid var(--border-light); color: var(--text-primary); border-radius: 8px; padding: 10px;"></textarea>
                            </div>
                            <div class="col-12 text-center mt-4">
                                <button type="submit" class="cta-premium border-0" style="padding: 12px 32px; cursor: pointer;">
                                    <i class="fas fa-paper-plane me-2"></i> Envoyer mon témoignage
                                </button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</section>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${pageTitle}">Témoignages - African Mission Corporate</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
<div class="container my-5">
    <h1 class="text-center mb-4">Témoignages de nos clients</h1>

    <!-- Message de succès après soumission -->
    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${successMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <!-- Section Liste des témoignages -->
    <div class="row mb-5">
        <div th:if="${testimonials.empty}" class="col-12 text-center text-muted">
            <p>Aucun témoignage pour le moment. Soyez le premier à donner votre avis !</p>
        </div>
        <div th:each="t : ${testimonials}" class="col-md-4 mb-4">
            <div class="card h-100 shadow-sm">
                <div class="card-body">
                    <div class="mb-2 text-warning">
                        <i th:each="star : ${#numbers.sequence(1, t.rating)}" class="fas fa-star"></i>
                    </div>
                    <p class="card-text" th:text="${t.content}">Contenu du témoignage...</p>
                    <h6 class="card-subtitle mb-1 text-primary" th:text="${t.clientName}">Nom du Client</h6>
                    <small class="text-muted" th:if="${t.company}" th:text="${t.company}">Entreprise</small>
                </div>
            </div>
        </div>
    </div>

    <!-- Formulaire de soumission -->
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow">
                <div class="card-header bg-primary text-white">
                    <h4 class="mb-0">Laissez-nous votre avis</h4>
                </div>
                <div class="card-body">
                    <form th:action="@{/testimonials/submit}" method="post">
                        <div class="mb-3">
                            <label for="clientName" class="form-label">Votre Nom *</label>
                            <input type="text" class="form-control" id="clientName" name="clientName" required>
                        </div>
                        <div class="mb-3">
                            <label for="company" class="form-label">Entreprise / Organisation</label>
                            <input type="text" class="form-control" id="company" name="company">
                        </div>
                        <div class="mb-3">
                            <label for="rating" class="form-label">Note (sur 5)</label>
                            <select class="form-select" id="rating" name="rating">
                                <option value="5">5 / 5 - Excellent</option>
                                <option value="4">4 / 5 - Très bien</option>
                                <option value="3">3 / 5 - Moyen</option>
                                <option value="2">2 / 5 - Insatisfaisant</option>
                                <option value="1">1 / 5 - À éviter</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="content" class="form-label">Votre Témoignage *</label>
                            <textarea class="form-control" id="content" name="content" rows="4" required></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Soumettre mon témoignage</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
